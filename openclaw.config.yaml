# OpenClaw orchestration config — placeholder scaffold.
# Real skill/channel bindings get filled in as each phase (see README) lands.

scheduler:
  # Pre-market run: data fetch + indicator engine + signal skill -> notify skill
  pre_market_run:
    enabled: false  # TODO: enable once running on the OpenClaw VPS
    # cron: ""      # TODO: set once broker/market-hours timezone is finalized

  # Post-market run: same pipeline, end-of-day read
  post_market_run:
    enabled: false  # TODO: enable once running on the OpenClaw VPS
    # cron: ""      # TODO: set once broker/market-hours timezone is finalized

  # Light daily/twice-daily monitor check (Claude risk judgment on open positions,
  # not tight intraday polling — hard SL/target handled by broker GTT/OCO)
  monitor_check:
    enabled: false  # TODO: enable once running on the OpenClaw VPS
    # cron: ""      # TODO: align with pre-market/post-market run times

skills:
  - name: data_fetch_skill
    enabled: true
  - name: indicator_engine
    enabled: true
  - name: signal_skill
    enabled: true
  # Telegram wired in Phase 3, Discord dual-channel routing added in Phase 8
  - name: notify_skill
    enabled: true
  - name: position_tracker_skill
    enabled: true
  - name: monitor_skill
    enabled: true
  - name: chat_skill
    enabled: true
  # Manual trigger only, not scheduled
  - name: cleanup_skill
    enabled: true
    manual_only: true

channels:
  telegram:
    enabled: true  # requires TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID in .env
  discord:
    enabled: true  # requires DISCORD_BOT_TOKEN + per-channel IDs in .env; routing skips
                    # silently per message type if its channel ID isn't set (see .env.example)
