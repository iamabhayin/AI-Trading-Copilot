# OpenClaw orchestration config — documentation scaffold only.
# OpenClaw does NOT read this file. Real scheduling lives on the Gateway
# itself, managed via `openclaw cron add/edit/list/rm` (see docs.openclaw.ai/cli/cron).
# This section documents the intended/target schedule so a reader knows
# what should be scheduled without having to query the Gateway. Keep it in
# sync by hand whenever the real jobs change.
#
# STATUS as of 2026-07-06: LIVE, as plain command-payload jobs (NOT agent
# turns). Two failure modes were hit and fixed today: (1) command payloads
# default to `sh -lc "<command>"`, but this Windows Gateway has no `sh` on
# PATH -- fixed by using a direct argv array instead of a shell string.
# (2) something (the user's own OpenClaw Discord agent) briefly converted
# all 4 jobs into agentTurn payloads that ask the AGENT to run the command
# via its own exec tool -- this got correctly blocked by the exec-approvals
# allowlist (only position_tracker_skill.py/chat_skill.py are pre-approved),
# and doesn't belong here anyway. Keep these as plain command payloads with
# direct argv going forward; delivery mode "none" since each script sends
# its own Telegram/Discord notifications via notify_skill.route_message().

scheduler:
  # Full pipeline: data fetch -> indicator engine -> signal skill -> notify skill.
  # Overnight news + gap check before the market opens.
  pre_market_run:
    enabled: true
    cron: "30 8 * * 1-5"
    timezone: Asia/Kolkata
    command: .venv/Scripts/python.exe skills/signal_skill.py

  # Full pipeline, repurposed from the old post_market_run slot. Catches
  # intraday shifts missed at the pre-market run.
  midday_run:
    enabled: true
    cron: "0 12 * * 1-5"
    timezone: Asia/Kolkata
    command: .venv/Scripts/python.exe skills/signal_skill.py

  # Full pipeline, repurposed from the old monitor_check slot. Last check
  # before market close.
  pre_close_run:
    enabled: true
    cron: "45 14 * * 1-5"
    timezone: Asia/Kolkata
    command: .venv/Scripts/python.exe skills/signal_skill.py

  # Position risk-check (Claude risk judgment + stop-loss/target trigger on
  # open positions) — moved to its own slot since monitor_check's original
  # name now belongs to a signal-pipeline run above. Runs after market close.
  monitor_check:
    enabled: true
    cron: "35 15 * * 1-5"
    timezone: Asia/Kolkata
    command: .venv/Scripts/python.exe skills/monitor_skill.py

  # Market news digest: relevant recent headlines per watchlist ticker,
  # independent of whether any ticker actually triggers a BUY/SELL signal.
  # Reuses the existing news fetch + Ollama relevance filter -- no extra
  # Claude cost. Routes to the #market-news Discord channel if configured.
  morning_news_digest:
    enabled: true
    cron: "0 8 * * 1-5"
    timezone: Asia/Kolkata
    command: .venv/Scripts/python.exe skills/notify_skill.py --digest

  evening_news_digest:
    enabled: true
    cron: "0 18 * * 1-5"
    timezone: Asia/Kolkata
    command: .venv/Scripts/python.exe skills/notify_skill.py --digest

skills:
  - name: data_fetch_skill
    enabled: true
  - name: indicator_engine
    enabled: true
  - name: signal_skill
    enabled: true
  # Telegram wired in Phase 3, Discord dual-channel routing added in Phase 8
  - name: notify_skill
    enabled: true
  - name: position_tracker_skill
    enabled: true
  - name: monitor_skill
    enabled: true
  - name: chat_skill
    enabled: true
  # Manual trigger only, not scheduled
  - name: cleanup_skill
    enabled: true
    manual_only: true

channels:
  telegram:
    enabled: true  # requires TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID in .env
  discord:
    enabled: true  # requires DISCORD_BOT_TOKEN + per-channel IDs in .env; routing skips
                    # silently per message type if its channel ID isn't set (see .env.example)
